<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courtside Edge</title>
<meta name="description" content="Daily NBA player prop and game projections compared with sportsbook lines.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23F08A24'/><path d='M2 16h28M16 2v28M6 6c6 5 6 15 0 20M26 6c-6 5-6 15 0 20' stroke='%2314213D' stroke-width='1.6' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="ball" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><path d="M2 16h28M16 2v28M6 6c6 5 6 15 0 20M26 6c-6 5-6 15 0 20"/></svg>
    <div>
      <h1>Courtside Edge</h1>
      <p id="slate-label" class="sub">Loading today's slate…</p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="picks" aria-selected="true">Edges</button>
    <button role="tab" data-tab="games">Games</button>
    <button role="tab" data-tab="mybets">My bets</button>
    <button role="tab" data-tab="players">Players</button>
    <button role="tab" data-tab="record">Record</button>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <p id="fmt" class="chips" style="align-items:center;margin-bottom:10px"></p>
  <p id="updated"></p>
  <p>Projections are estimates, not guarantees. Sportsbooks win most of the time. Bet small, and only what you can afford to lose.</p>
</footer>

<template id="tpl-error"><div class="empty"><h2>Couldn't load the data</h2><p>The daily update may still be running. Refresh in a few minutes.</p></div></template>
<script src="app.js"></script>
</body>
</html>
